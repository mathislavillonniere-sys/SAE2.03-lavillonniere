<!doctype html>
<html lang="fr">
  <head>
    <title>SAE2.03 APP</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./component/iteration1/Movie/style.css" />
    <link rel="stylesheet" href="./component/Profile/style.css" />
    <link
      rel="stylesheet"
      href="./component/iteration3/MovieDetail/style.css"
    />
    <link
      rel="stylesheet"
      href="./component/iteration4/MovieCategory/style.css"
    />
  </head>

  <body>
    <header id="header"></header>

    <section id="content"></section>

    <script type="module">
      import { NavBar } from "./component/NavBar/script.js";
      import { DataMovie } from "./data/dataMovie.js";
      import { Movie } from "./component/iteration1/Movie/script.js";
      import { MovieDetail } from "./component/iteration3/MovieDetail/script.js";
      import { Profile } from "./component/Profile/script.js";
      import { DataProfile } from "./data/dataProfile.js";
      import { MovieCategory } from "./component/iteration4/MovieCategory/script.js";

      window.C = {};
      window.V = {};
      window.activeProfile = null;

      C.toggleCategories = function () {
        const overlay = document.querySelector("#navbar__categories-overlay");
        if (overlay)
          overlay.classList.toggle("navbar__categories-overlay--active");
      };

      C.closeCategories = function () {
        const overlay = document.querySelector("#navbar__categories-overlay");
        if (overlay)
          overlay.classList.remove("navbar__categories-overlay--active");
      };

      C.toggleMenu = function () {
        const menu = document.querySelector("#navbar__menu");
        if (menu) menu.classList.toggle("navbar__list--open");
      };

      C.closeMenu = function () {
        const menu = document.querySelector("#navbar__menu");
        if (menu) menu.classList.remove("navbar__list--open");
      };

      C.setActiveNav = function (item) {
        const items = document.querySelectorAll("#navbar__menu .navbar__item");
        items.forEach((el) => el.classList.remove("navbar__item--active"));
        if (item === "home") items[0]?.classList.add("navbar__item--active");
        if (item === "categories")
          items[1]?.classList.add("navbar__item--active");
        if (item === "favoris") items[2]?.classList.add("navbar__item--active");
      };

      V.renderNavBar = function (categories) {
        document.querySelector("#header").innerHTML = NavBar.format(categories);
        setTimeout(() => C.setActiveNav("home"), 0);
      };
      V.renderCarousel = function (categories) {
        let html = `<div style="width:100%"><div class="categorie__carousel">`;
        for (let cat of categories) {
          html += `<div class="categories__carousel-item" onclick="C.handlerCategory('${cat.name}')">${cat.name}</div>`;
        }
        html += `</div></div>`;
        return html;
      };
      C.start = async function () {
        if (!window.activeProfile) {
          document.querySelector("#header").innerHTML = "";
          let profiles = await DataProfile.requestProfiles();
          document.querySelector("#content").innerHTML =
            Profile.format(profiles);
          return;
        }
        let categories = await DataMovie.requestCategories();
        V.renderNavBar(categories);

        let films = await DataMovie.requestMovies(window.activeProfile.min_age);

        // Carrousel dans un div séparé, films dans un autre
        document.querySelector("#content").innerHTML =
          `<div class="carousel-wrapper">${V.renderCarousel(categories)}</div>
     <div class="films-wrapper">${Movie.format(films)}</div>`;
      };

      C.handlerCategory = async function (categoryName) {
        C.closeCategories();
        C.closeMenu();
        setTimeout(() => C.setActiveNav("categories"), 0);

        let categories = await DataMovie.requestCategories();
        let allMovies = await DataMovie.requestMovies(
          window.activeProfile.min_age,
        );
        let filteredMovies = allMovies.filter(
          (m) => m.category_name === categoryName,
        );

        if (filteredMovies.length === 0) {
          document.querySelector("#content").innerHTML =
            `<div class="carousel-wrapper">${V.renderCarousel(categories)}</div>
       <div class="films-wrapper"><p style="color:white; padding:2rem;">Aucun film disponible pour : ${categoryName}</p></div>`;
        } else {
          document.querySelector("#content").innerHTML =
            `<div class="carousel-wrapper">${V.renderCarousel(categories)}</div>
       <div class="films-wrapper">${Movie.format(filteredMovies)}</div>`;
        }
      };

      C.handlerDetail = async function (id) {
        let film = await DataMovie.requestMovieDetails(id);
        let isFav = 0;
        if (window.activeProfile) {
          isFav = await DataMovie.isFavoris(window.activeProfile.id, id);
        }
        document.querySelector("#content").innerHTML = MovieDetail.format(
          film,
          isFav,
        );
      };

      C.handlerHome = function () {
        C.start();
      };

      C.handlerChangeProfile = function () {
        window.activeProfile = null;
        C.start();
      };

      C.handlerSelectProfile = function (id, name, min_age) {
        window.activeProfile = { id, name, min_age };
        C.start();
      };

      C.handlerFavoris = async function () {
        if (!window.activeProfile) return;
        let films = await DataMovie.getFavoris(window.activeProfile.id);
        if (films.length === 0) {
          document.querySelector("#content").innerHTML =
            "<p style='color:white; padding:2rem;'>Votre liste de favoris est vide.</p>";
        } else {
          // CORRECTION ICI : On a ajouté le <div class="films-wrapper"> pour la grille !
          document.querySelector("#content").innerHTML =
            `<div class="films-wrapper">${Movie.format(films, true)}</div>`;
        }
        setTimeout(() => C.setActiveNav("favoris"), 0);
      };

      // NOUVELLE FONCTION : Affiche la vidéo Youtube dans la page
      C.showTrailer = function (url) {
        const container = document.getElementById("trailer-container");
        const iframe = document.getElementById("trailer-iframe");

        // On convertit le lien Youtube classique en lien "Intégration" (embed)
        let embedUrl = url;
        if (url.includes("watch?v=")) {
          embedUrl = url.replace("watch?v=", "embed/");
        }

        iframe.src = embedUrl;
        container.style.display = "block"; // On affiche le lecteur caché
      };

      C.handlerAddFavoris = async function (id_movie) {
        let res = await DataMovie.addFavoris(window.activeProfile.id, id_movie);
        alert(res);
        C.handlerDetail(id_movie);
      };

      C.handlerDeleteFavoris = async function (id_movie) {
        if (!window.activeProfile) return;
        let res = await DataMovie.deleteFavoris(
          window.activeProfile.id,
          id_movie,
        );
        alert(res);
        C.handlerDetail(id_movie);
      };
      C.setActiveNav = function (item) {
        console.log("setActiveNav appelé avec :", item);
        const items = document.querySelectorAll("#navbar__menu .navbar__item");
        console.log("nombre items :", items.length);
        items.forEach((el) => el.classList.remove("navbar__item--active"));
        if (item === "home") items[0]?.classList.add("navbar__item--active");
        if (item === "categories")
          items[1]?.classList.add("navbar__item--active");
        if (item === "favoris") items[2]?.classList.add("navbar__item--active");
      };
      // Ouvre le Pop-up et lance la vidéo
      C.showTrailer = function (url) {
        const popup = document.getElementById("video-popup");
        const iframe = document.getElementById("video-iframe");

        // Conversion du lien Youtube pour l'intégration
        let embedUrl = url;
        if (url.includes("watch?v=")) {
          embedUrl = url.replace("watch?v=", "embed/") + "?autoplay=1";
        }

        iframe.src = embedUrl;
        popup.style.display = "flex";
      };

      // Ferme le Pop-up et ARRÊTE la vidéo
      C.closeTrailer = function () {
        const popup = document.getElementById("video-popup");
        const iframe = document.getElementById("video-iframe");

        popup.style.display = "none";
        iframe.src = ""; // Très important pour couper le son quand on ferme !
      };

      C.start();
    </script>
  </body>
</html>
<script type="module"></script>
